services:
  backend:
    build: .
    container_name: python_api
    env_file:
      - .env
    networks:
      - appnet
    restart: always

  nginx:
    image: nginx:alpine
    container_name: py_nginx
    ports:
      - "80:80"
    networks:
      - appnet
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: always
    
networks:
  appnet:
